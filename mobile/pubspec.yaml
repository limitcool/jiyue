name: jiyue_mobile
description: "Jiyue Mobile (霁月) - Fast, elegant local-first Markdown notes with S3/WebDAV sync."
publish_to: 'none'
version: 0.3.1+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_markdown: ^0.7.6+1
  ffi: ^2.1.3
  path_provider: ^2.1.5
  intl: ^0.20.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logo/
