name: Build & Direct Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'mobile-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否直接发布到 GitHub Releases 直出 APK (可免解压直接下载)'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag 标签（留空默认使用 mobile-latest）'
        type: string
        default: 'mobile-latest'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 Java 17 (Zulu JDK)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. 配置 Flutter 环境并启用缓存
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. 获取 Flutter 依赖
      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      # 5. 打包 Release APK
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      # 6. 重命名为友好的直出文件名
      - name: Prepare Direct APK
        id: prepare_apk
        run: |
          mkdir -p dist
          # 获取构建版本号 (如 0.2.0)
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d '\r' | cut -d'+' -f1)
          APK_NAME="jiyue-mobile-v${VERSION}.apk"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "dist/jiyue-mobile-latest.apk"
          echo "apk_path=dist/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 7. 上传 Artifact (作为构建流水线附件备份)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 14

      # 8. 直出发布到 GitHub Release（核心：免解压，在手机/浏览器直接一键下载安装）
      - name: Direct Publish to Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'mobile-latest' }}
          name: "Jiyue Mobile (霁月移动端直出) - ${{ steps.prepare_apk.outputs.version }}"
          body: |
            ### 📱 霁月移动端 Android APK 直出下载

            - **文件名称**：`${{ steps.prepare_apk.outputs.apk_name }}`
            - **版本**：`v${{ steps.prepare_apk.outputs.version }}`
            - **构建时间**：${{ github.event.head_commit.timestamp || 'Manual Dispatch' }}
            - **构建 Commit**：`${{ github.sha }}`

            > 💡 **提示**：下方 Assets 列表中的 `.apk` 文件为**独立直出安装包**，在安卓手机或电脑浏览器中直接点击即可高速下载安装，无需解压缩。
          prerelease: true
          make_latest: false
          files: |
            dist/*.apk
