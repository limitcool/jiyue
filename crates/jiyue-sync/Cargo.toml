[package]
name = "jiyue-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2"
blake3 = "1"
opendal = { version = "0.59.5", default-features = false, features = ["blocking", "executors-tokio", "reqwest-rustls-tls", "services-s3", "services-webdav", "services-memory", "layers-retry", "layers-timeout"] }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
