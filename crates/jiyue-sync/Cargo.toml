[package]
name = "jiyue-sync"
version = "0.1.1"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2"
blake3 = "1"
opendal = { version = "0.59.5", default-features = false, features = ["blocking", "executors-tokio", "reqwest-rustls-tls", "services-s3", "services-webdav", "services-memory", "layers-retry", "layers-timeout"] }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
