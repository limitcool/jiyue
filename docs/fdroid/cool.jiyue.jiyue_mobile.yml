AutoName: Jiyue Notes
Summary: Local-first Markdown & wikilink notes with S3/WebDAV sync
Description: |-
  Jiyue is a fast, local-first, open-source Markdown note-taking app powered
  by a Rust core engine. Your notes stay as plain Markdown files inside
  normal folders, compatible with Obsidian vaults.

  Highlights:
  * Multi-vault management: open local folders, create clean vaults, or import
    synced vaults via desktop QR export.
  * Native Rust sync over S3 (AWS, R2, MinIO, RustFS) and WebDAV with three-way merge.
  * Wikilinks, backlinks, outline navigation, bookmarks, and word statistics.
  * Pure open-source dependencies without Google Play Services or proprietary blobs.

RepoType: git
Repo: https://github.com/limitcool/jiyue.git

Builds:
  # Update versionName, versionCode, and commit to match the target release tag
  # defined in mobile/pubspec.yaml (e.g. version: 0.3.8+9 -> v0.3.8).
  - versionName: 0.4.0
    versionCode: 10
    commit: v0.4.0
    subdir: mobile
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates cmake ninja-build clang pkg-config python3
    ndk: 27.0.12077973
    srclibs:
      - flutter@3.29.2
    prebuild:
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get
    build:
      - export PATH="$$flutter$$/bin:$HOME/.cargo/bin:$PATH"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - (cd .. && python3 scripts/build-android-ffi.py --locked)
      - flutter build apk --release --flavor foss --dart-define=FOSS_BUILD=true

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v([0-9]+\.[0-9]+\.[0-9]+)$
CurrentVersion: 0.4.0
CurrentVersionCode: 10
