Categories:
  - Note
  - Writing
License: MIT
AuthorName: limitcool
SourceCode: https://github.com/limitcool/jiyue
IssueTracker: https://github.com/limitcool/jiyue/issues
Changelog: https://github.com/limitcool/jiyue/releases

AutoName: 霁月

RepoType: git
Repo: https://github.com/limitcool/jiyue.git

Builds:
  - versionName: 0.4.0
    versionCode: 10
    commit: 2aabdcb2063efd944ea56e0781dd1fcb4e7697f0
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential clang cmake
      - apt-get install -y --no-install-recommends ninja-build pkg-config python3
      - apt-get install -y --no-install-recommends ca-certificates rustup
    output: build/app/outputs/flutter-apk/app-foss-release.apk
    srclibs:
      - flutter@3.29.2
    rm:
      - installer
      - mobile/ios
    prebuild:
      - sed -i -e '/maven\.aliyun\.com/d' android/build.gradle.kts
      - sed -i -e '/maven\.aliyun\.com/d' android/settings.gradle.kts
      - export PUB_CACHE=/tmp/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - rustup toolchain install 1.99.1 --profile minimal -c clippy -c rustfmt
      - rustup default 1.99.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - rustup target add x86_64-linux-android
      - cargo fetch --locked --manifest-path ../Cargo.toml
    build:
      - export CI=true
      - export PUB_CACHE=/tmp/.pub-cache
      - export ANDROID_HOME="$$SDK$$"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - python3 ../scripts/build-android-ffi.py --locked
      - $$flutter$$/bin/flutter build apk --release --flavor foss --dart-define=FOSS_BUILD=true
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v([0-9]+\.[0-9]+\.[0-9]+)$
UpdateCheckData: mobile/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.4.0
CurrentVersionCode: 10
